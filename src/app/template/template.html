<div class="template-container">
    <header class="menu-container">
        <div class="menu-logo">
            <i class="material-symbols-outlined" aria-hidden="true">checklist</i>
            <span class="logo-text">To-do List</span>
        </div>

        <nav class="menu">
            <button class="btn-menu btn-create" (click)="onClickCreateTask()" type="button" aria-label="Create Task">
                <span class="btn-span">Create Task</span>
                <i class="material-symbols-outlined" aria-hidden="true">add_circle</i>
            </button>
        </nav>

        <div class="menu-user">
            <span>Hello,</span>
            <span class="user-name">User Name</span>
            <span class="material-symbols-outlined" aria-hidden="true">account_circle</span>
        </div>
    </header>

    <main class="main-container">
        @for(task of taskList(); track task.id){
            <app-task-template 
                [task]="task"
                (deleted)="onTaskDeleted($event)">
            </app-task-template>
        }

        @if(isFormVisible){
            <app-task-registration 
                (cancel)="onCancelTaskRegistration()"
                (created)="onTaskCreated($event)">
            </app-task-registration>
        }
    </main>
</div>
