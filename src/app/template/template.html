<div class="template-container">
    <header class="menu-container">
        <div class="menu-logo">
            <i class="material-symbols-outlined" aria-hidden="true">checklist</i>
            <span class="logo-text">To-do List</span>
        </div>

        <nav class="menu">
            <button class="btn-menu btn-create-task" (click)="onClickCreateTask()" type="button">
                Create Task
                <i class="material-symbols-outlined">add_circle</i>
            </button>
        </nav>

        <div class="menu-user">
            <span>Hello,</span>
            <span class="user-name">User Name</span>
            <span class="material-symbols-outlined" aria-hidden="true">account_circle</span>
        </div>
    </header>

    <main class="main-container">
        <router-outlet></router-outlet>

        @if(isFormVisible){
            <app-task-registration></app-task-registration>
        }
    </main>
</div>
