<div class="task-container">
    <div class="task-content">
        <div class="header">
            <h2 class="title">{{ task.title }}</h2>
            <span class="task-status">{{ task.taskStatus }}</span>
        </div>

        <span class="due-date">Due date: {{ task.dueDate }}</span>

        <p>{{ task.description }}</p>

        <div class="btn-group">
            <button class="btn-complete" type="button">Mark as completed</button>

            <button 
                class="btn-delete" 
                type="button"
                (click)="onClickDeleteTask()">Delete
            </button>
        </div>
    </div>

    @if (isConfirmationVisible) {
        <div class="delete-confirmation-overlay">
            <div class="confirmation-box">
                <p>Are you sure you want to delete this task?</p>                

                <div class="btn-group">
                    <button class="btn-confirm" type="button" (click)="onDeletionConfirmed()">Confirm</button>
                    <button class="btn-cancel" type="button" (click)="onDeletionCancelled()">Cancel</button>
                </div>         
                
                <!-- progress bar -->
                <div class="countdown-track" aria-hidden="true">
                    <div class="countdown-fill"></div>
                </div>
            </div>
        </div>
    }
</div>
