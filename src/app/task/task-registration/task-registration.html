<div class="overlay">
    <div class="form-container">
        <header class="form-header">
            <h1>Task Registration</h1>
        </header>

        <main class="main">
            <form [formGroup]="form" (ngSubmit)="onSubmit()">
                <div class="form-group">
                    <label for="title">Title:</label>
                    <input formControlName="title" type="text" id="title" name="title" placeholder="Ex: My Task" required>

                    @if(form.controls.title.touched && form.controls.title.hasError('required')){
                        <span class="form-error-hint">Title is required.</span>
                    }
                </div>
                
                <div class="form-group">
                    <label for="dueDate">Due date:</label>
                    <input formControlName="dueDate" type="date" id="dueDate" name="dueDate" required>

                    
                    @if(form.controls.dueDate.touched && form.controls.dueDate.hasError('required')){
                        <span class="form-error-hint">Due date is required.</span>
                    }
                </div>

                <div class="form-group description-group">
                    <label for="description">Description:</label>
                    <textarea formControlName="description" id="description" name="description"></textarea>
                </div>

                <div class="btn-form-group">
                    <button class="btn-form btn-create-task" type="submit">Create Task</button>
                    <button class="btn-form btn-cancel" (click)="onClickCancelBtn()" type="button">Cancel</button>
                </div>
            </form>
        </main>
    </div>
</div>
