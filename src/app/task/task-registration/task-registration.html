<div class="overlay">
    <div class="form-container">
        <header class="header">
            <h1>Task Registration</h1>
        </header>

        <main class="main">
            <form class="task-form" [formGroup]="form" (ngSubmit)="onSubmit()">
                <div class="form-group">
                    <label for="title">Title:</label>
                    <input formControlName="title" type="text" id="title" name="title" required>
                </div>

                <div class="form-group">
                    <label for="description">Description:</label>
                    <textarea formControlName="description" id="description" name="description" required></textarea>
                </div>

                <div class="form-group">
                    <label for="dueDate">Due Date:</label>
                    <input formControlName="dueDate" type="date" id="dueDate" name="dueDate" required>
                </div>

                <button type="submit">Create Task</button>
            </form>
        </main>
    </div>
</div>
